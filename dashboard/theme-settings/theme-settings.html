<!DOCTYPE html>
<html lang="en">

<!-- Look & Feel panel: change colours and text sizes of the graphics without touching any CSS. -->

<head>
    <meta charset="UTF-8">
    <title>Look &amp; Feel</title>
    <link rel="stylesheet" href="theme-settings.css">
</head>

<body>
    <p class="theme-intro">
        Change colours and text sizes here. Changes show up on the graphics right away.
        The small arrow next to a value puts it back to the original.
    </p>

    <div id="theme-fields"></div>

    <button type="button" id="theme-reset-all" class="theme-reset-all">Reset everything to the original look</button>

    <script src="theme-settings.js"></script>
</body>
</html>
