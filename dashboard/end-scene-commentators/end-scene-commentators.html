<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>End Scene Commentators</title>
    <link rel="stylesheet" href="end-scene-commentators.css">
</head>

<body>
    <fieldset class="end-commentator-controls">
        <legend>End Scene Commentators</legend>
        <p>Enter up to four names and profile-picture URLs for the end scene.</p>
        <div class="end-winner-row">
            <label for="end-winner-team">Winner team name</label>
            <input id="end-winner-team" data-end-winner-team type="text" maxlength="80">
        </div>
        <div class="end-commentator-row">
            <label for="end-commentator-name-0">Commentator 1 name</label>
            <input id="end-commentator-name-0" data-end-commentator-name="0" type="text" maxlength="80">
            <label for="end-commentator-pfp-0">Commentator 1 PFP URL</label>
            <input id="end-commentator-pfp-0" data-end-commentator-pfp="0" type="url" placeholder="https://...">
        </div>
        <div class="end-commentator-row">
            <label for="end-commentator-name-1">Commentator 2 name</label>
            <input id="end-commentator-name-1" data-end-commentator-name="1" type="text" maxlength="80">
            <label for="end-commentator-pfp-1">Commentator 2 PFP URL</label>
            <input id="end-commentator-pfp-1" data-end-commentator-pfp="1" type="url" placeholder="https://...">
        </div>
        <div class="end-commentator-row">
            <label for="end-commentator-name-2">Commentator 3 name</label>
            <input id="end-commentator-name-2" data-end-commentator-name="2" type="text" maxlength="80">
            <label for="end-commentator-pfp-2">Commentator 3 PFP URL</label>
            <input id="end-commentator-pfp-2" data-end-commentator-pfp="2" type="url" placeholder="https://...">
        </div>
        <div class="end-commentator-row">
            <label for="end-commentator-name-3">Commentator 4 name</label>
            <input id="end-commentator-name-3" data-end-commentator-name="3" type="text" maxlength="80">
            <label for="end-commentator-pfp-3">Commentator 4 PFP URL</label>
            <input id="end-commentator-pfp-3" data-end-commentator-pfp="3" type="url" placeholder="https://...">
        </div>
    </fieldset>

    <script src="end-scene-commentators.js"></script>
</body>

</html>
