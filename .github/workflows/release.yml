name: Build release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build, e.g. v1.2.0'
        required: true

permissions:
  contents: write

env:
  # Folders your build writes to. Adjust to match your vite config / .gitignore.
  BUILD_DIRS: 'dashboard graphics extension'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Work out tag name
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit build output and move tag
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Build folders are usually gitignored, so force-add whichever exist.
          for dir in $BUILD_DIRS; do
            if [ -d "$dir" ]; then
              git add -f "$dir"
            fi
          done

          if git diff --cached --quiet; then
            echo "No build output to commit - check BUILD_DIRS."
            exit 1
          fi

          git commit -m "Build $TAG"
          git tag -f "$TAG"
          git push -f origin "refs/tags/$TAG"
