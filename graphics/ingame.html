<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <!-- Here is were u link the stylesheets -->
    <link rel="stylesheet" href="styles/globals.css">
    <link rel="stylesheet" href="styles/ingame/ingame.css">
</head>

<body>
    <div class="scene">
        <div class="scene-stuff">
            <div class="commentator-names" data-commentator-names>
                <span class="commentator-names-track"></span>
            </div>
            <div class="active-round-info">
                <div class="active-round-teams">
                    <div class="active-round-team active-round-team-a">
                        <span data-active-round-team-a></span>
                        <span class="active-round-team-score" data-active-round-score-a></span>
                    </div>
                    <div class="active-round-team active-round-team-b">
                        <span data-active-round-team-b></span>
                        <span class="active-round-team-score" data-active-round-score-b></span>
                    </div>
                </div>
            </div>
            <div class="fun-fact" data-fun-fact aria-live="polite" aria-hidden="true">
                <img src="img/8_extra/FunFactDark.png" alt="">
                <div class="fun-fact-text" data-fun-fact-text></div>
            </div>
        </div>
    </div>

<script src="../node_modules/gsap/dist/gsap.min.js"></script>
<script src="scripts/globals.js"></script>
<script src="scripts/replicants.js"></script>
<script src="scripts/break/break.js"></script>
<script src="scripts/ingame.js"></script>
</body>

</html>
