
<!-- Break Scene includes Everything, From Team display, Maps Display, and Commentator/Intermission Screen -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <!-- Here is were u link the stylesheets -->
    <link rel="stylesheet" href="styles/theme.css">
    <link rel="stylesheet" href="styles/globals.css">
    <link rel="stylesheet" href="styles/break/break.css">
    <link rel="stylesheet" href="styles/break/main.css">
    <link rel="stylesheet" href="styles/break/teams.css">
    <link rel="stylesheet" href="styles/break/rosters-ui.css">
    <link rel="stylesheet" href="styles/break/stages.css">
    <link rel="stylesheet" href="styles/break/starting-soon.css">

</head>

<body>

<!-- Starting Soon Scene-->
<div class="scene starting-soon">
    <div class="scene-content">
        <div class="background"></div>
        <video class="bubble-loop" src="video/bubble-loop.webm" autoplay loop muted playsinline preload="auto"></video>
        <div class="swimming-shark"></div>
        <div class="title"></div>
        <img id="homeland-image" src="img/1_startingsoon/homeland-edition-sticker.png" alt="" hidden>
    </div>
</div>

<!-- Intermission Scene -->
<div class="scene main-scene">
    <div class="scene-content">
        <img class="commentator-background" src="img/2_commbreak/sw-comm-bg.png" alt="">
        <video class="bubble-loop" src="video/bubble-loop.webm" autoplay loop muted playsinline preload="auto"></video>
        <img class="commentator-cover" src="img/2_commbreak/comm-frames.png" alt="">
        <img class="commentator-foreground" src="img/2_commbreak/next-up-border.png" alt="">
        <div class="commentator-pfp commentator-pfp-a" data-commentator-pfp="0"></div>
        <div class="commentator-pfp commentator-pfp-b" data-commentator-pfp="1"></div>
        <div class="next-match-info" data-next-match-info>
            <div class="next-match-name" data-next-match-name></div>
            <!-- Unnecessary or now, might be used later.
                <div class="next-match-teams">
                <span data-next-match-team-a></span>
                <span aria-hidden="true">vs</span>
                <span data-next-match-team-b></span>
            </div> 
            -->
        </div>
        <div class="commentator-card commentator-card-a">
            <div class="commentator-card-name" data-commentator-slot="0"></div>
            <div class="commentator-card-social" data-commentator-social="0"></div>
            <div class="commentator-card-pronouns" data-commentator-pronouns="0"></div>

        </div>
        <div class="commentator-card commentator-card-b">
            <div class="commentator-card-name" data-commentator-slot="1"></div>
            <div class="commentator-card-social" data-commentator-social="1"></div>
            <div class="commentator-card-pronouns" data-commentator-pronouns="1"></div>
        </div>
    </div>
</div>

<!-- Teams Scene -->
<div class="scene teams-scene">
    <div class="scene-content">
        <div class="teams-background">
            <div class="teams-background-image"></div>
            <video class="bubble-loop" src="video/bubble-loop.webm" autoplay loop muted playsinline preload="auto"></video>
            <div class="teams-roster">
                <div class="roster-pill roster-pill-a"></div>
                <div class="roster-pill roster-pill-b"></div>
                <div class="roster-splash">
                    <div class="roster-splash-edge"></div>
                    <div class="roster-splash-fill"></div>
                </div>
                <div class="roster-card roster-card-a"></div>
                <div class="roster-card roster-card-b"></div>
                <div class="roster-comm-bar">
                    <div class="roster-mic"></div>
                </div>
            </div>
            <div class="active-round-team-a-logo" data-active-round-team-a-logo></div>
            <div class="active-round-team-b-logo" data-active-round-team-b-logo></div>
        </div>
        <div class="active-round-info" aria-live="polite">
            <div class="active-round-teams">
                    
                <div class="active-round-team active-round-team-a">
                    <span data-active-round-team-a></span>
                    <div class="active-round-team-a-roster" data-active-round-team-a-roster></div>
                </div>
                <div class="active-round-team active-round-team-b">
                    <div class="active-round-team-b-roster" data-active-round-team-b-roster></div>
                    <span data-active-round-team-b></span>
                </div>
            </div>
            <div class="active-round-games" data-active-round-games></div>
            <div class="commentator-names" data-commentator-names><span class="commentator-names-track"></span></div>
        </div>
    </div>
</div>

<!-- Maps Scene -->
<div class="scene stages-scene">
    <div class="scene-content">
        <video class="bubble-loop" src="video/bubble-loop.webm" autoplay loop muted playsinline preload="auto"></video>
        <div class="stages-scoreboard" aria-live="polite">
            <div class="team-names">
                <fitted-text id="team-a-name-scoreboard"></fitted-text>
                <fitted-text id="team-b-name-scoreboard"></fitted-text>
            </div>
            <div class="scores">
                <fitted-text data-stage-score-a></fitted-text>
                <span></span>
                <fitted-text data-stage-score-b></fitted-text>
            </div>
        </div>
        <div class="commentator-names" data-commentator-names><span class="commentator-names-track"></span></div>

        <!-- Checks for bo3 or bo5 and shows the according frames also team names -->
        <div class="stages-grid bo5" data-stages-grid>
            <div class="stage" data-stage data-stage-index="0">
                <div class="stage-map-image" data-stage-map-image></div>
                <div class="stage-winner-image" data-stage-winner-image></div>
                <div class="stage-info">
                    <div class="stage-name" data-stage-name></div>
                </div>
            </div>
            <!-- Prolly stupid implementation of showing each map! with score and Map winner image -->
            <div class="stage" data-stage data-stage-index="1">
                <div class="stage-map-image" data-stage-map-image></div>
                <div class="stage-winner-image" data-stage-winner-image></div>
                <div class="stage-info">
                    <div class="stage-name" data-stage-name></div>
                </div>
            </div>
            <div class="stage" data-stage data-stage-index="2">
                <div class="stage-map-image" data-stage-map-image></div>
                <div class="stage-winner-image" data-stage-winner-image></div>
                <div class="stage-info">
                    <div class="stage-name" data-stage-name></div>
                </div>
            </div>
            <div class="stage" data-stage data-stage-index="3">
                <div class="stage-map-image" data-stage-map-image></div>
                <div class="stage-winner-image" data-stage-winner-image></div>
                <div class="stage-info">
                    <div class="stage-name" data-stage-name></div>
                </div>
            </div>
            <div class="stage" data-stage data-stage-index="4">
                <div class="stage-map-image" data-stage-map-image></div>
                <div class="stage-winner-image" data-stage-winner-image></div>
                <div class="stage-info">
                    <div class="stage-name" data-stage-name></div>
                </div>
            </div>
        </div>
        <div class="stages-frame" data-stages-frame></div>
        <div class="stages-mode-images" data-stages-mode-images>
            <div class="stage-mode-image" data-stage-mode-image="0"></div>
            <div class="stage-mode-image" data-stage-mode-image="1"></div>
            <div class="stage-mode-image" data-stage-mode-image="2"></div>
            <div class="stage-mode-image" data-stage-mode-image="3"></div>
            <div class="stage-mode-image" data-stage-mode-image="4"></div>
        </div>
        <div class="stages-elements" data-stages-elements>
            <div class="stages-labels">
                <div class="stage-label" data-stage-label="0">
                    <div class="stage-name" data-stage-label-name></div>
                </div>
                <div class="stage-label" data-stage-label="1">
                    <div class="stage-name" data-stage-label-name></div>
                </div>
                <div class="stage-label" data-stage-label="2">
                    <div class="stage-name" data-stage-label-name></div>
                </div>
                <div class="stage-label" data-stage-label="3">
                    <div class="stage-name" data-stage-label-name></div>
                </div>
                <div class="stage-label" data-stage-label="4">
                    <div class="stage-name" data-stage-label-name></div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Scene transition -->
<video id="transition" src="video/stinger.webm" playsinline preload="auto"></video>

<!-- im piblling it oh yea -->
<img id="pibble-image" src="img/2_commbreak/pibble-mandatory.jpg" alt="" hidden>

<!-- Here is where u link the scripts -->
<script src="../node_modules/gsap/dist/gsap.min.js"></script>
<script src="scripts/theme.js"></script>
<script src="scripts/globals.js"></script>
<script src="scripts/replicants.js"></script>
<script src="scripts/break/break.js"></script>
<script src="scripts/break/stages.js"></script>
<script src="scripts/break/sceneSwitcher.js"></script>
<script src="scripts/pibble.js"></script>
<script src="scripts/homeland.js"></script>
</body>

</html>
