<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="styles/globals.css">
    <link rel="stylesheet" href="styles/end/end.css">
</head>

<body>
<main class="scene end-scene" aria-label="Shark Tank end scene">

        <div class="end-background" aria-hidden="true"></div>
        <div class="end-commentators" aria-label="Commentators">
            <div class="end-commentator" data-end-commentator="0">
                <div class="end-commentator-pfp" data-end-commentator-pfp="0"></div>
                <div class="end-commentator-details">
                    <div class="end-commentator-name" data-end-commentator-name="0"></div>
                    <div class="end-commentator-social" data-end-commentator-social="0"></div>
                </div>
            </div>
            <div class="end-commentator" data-end-commentator="1">
                <div class="end-commentator-pfp" data-end-commentator-pfp="1"></div>
                <div class="end-commentator-details">
                    <div class="end-commentator-name" data-end-commentator-name="1"></div>

                </div>
            </div>
            <div class="end-commentator" data-end-commentator="2">

                </div>
            </div>
            <div class="end-commentator" data-end-commentator="3">
                <div class="end-commentator-pfp" data-end-commentator-pfp="3"></div>
                <div class="end-commentator-details">
                    <div class="end-commentator-name" data-end-commentator-name="3"></div>
                    <div class="end-commentator-social" data-end-commentator-social="3"></div>
                </div>
            </div>
        </div>
        <div class="end-elements" aria-hidden="true"></div>
        <div class="end-winner-team" data-end-winner-team></div>
        <div class="end-pfp-overlay" aria-hidden="true"></div>
    </div>
</main>

<script src="scripts/globals.js"></script>
<script src="scripts/replicants.js"></script>
<script src="scripts/end/end.js"></script>
</body>

</html>
